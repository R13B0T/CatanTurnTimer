<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background rounded square (required for maskable) -->
  <rect width="512" height="512" rx="96" fill="#3D1F0A"/>

  <!-- Hex tile -->
  <polygon points="256,52 450,162 450,350 256,460 62,350 62,162"
    fill="#6B3A1F" stroke="#C8922A" stroke-width="14" stroke-linejoin="round"/>

  <!-- Clock face -->
  <circle cx="256" cy="256" r="108" fill="#3D1F0A" stroke="#C8922A" stroke-width="10"/>

  <!-- Hour ticks -->
  <line x1="256" y1="158" x2="256" y2="175" stroke="#C8922A" stroke-width="7" stroke-linecap="round"/>
  <line x1="256" y1="337" x2="256" y2="354" stroke="#C8922A" stroke-width="7" stroke-linecap="round"/>
  <line x1="158" y1="256" x2="175" y2="256" stroke="#C8922A" stroke-width="7" stroke-linecap="round"/>
  <line x1="337" y1="256" x2="354" y2="256" stroke="#C8922A" stroke-width="7" stroke-linecap="round"/>

  <!-- Minute hand (pointing ~12:00) -->
  <line x1="256" y1="256" x2="256" y2="178"
    stroke="#EDD5A3" stroke-width="11" stroke-linecap="round"/>
  <!-- Hour hand (pointing ~2:00) -->
  <line x1="256" y1="256" x2="310" y2="286"
    stroke="#EDD5A3" stroke-width="9" stroke-linecap="round"/>

  <!-- Centre dot -->
  <circle cx="256" cy="256" r="11" fill="#C8922A"/>
</svg>
